name: Provision ECS and ECR
on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region"
        required: true
        default: us-east-1
      ecr_repo_name:
        description: "ECR repository name"
        required: true
        default: pastebin-backend
      ecs_cluster_name:
        description: "ECS cluster name"
        required: true
        default: pastebin-cluster
      task_family:
        description: "ECS task definition family"
        required: true
        default: pastebin-task
      container_name:
        description: "Container name in task definition"
        required: true
        default: pastebin-container
      container_port:
        description: "Container port to expose"
        required: true
        default: '8000'
      cpu:
        description: "Task CPU (Fargate valid values: 256, 512, 1024, 2048, 4096)"
        required: true
        default: '256'
      memory:
        description: "Task Memory in MiB (Fargate: 512, 1024, 2048, 3072, 4096, 5120, 6144, 7168, 8192, 16384, 30720)"
        required: true
        default: '512'
      execution_role_name:
        description: "IAM role name for ECS task execution (will be created if missing)"
        required: true
        default: ecsTaskExecutionRole
      image_tag:
        description: "Image tag to reference in task def (e.g., latest or a commit SHA)"
        required: true
        default: latest

jobs:
  provision:
    name: Provision ECR, ECS Cluster, and Task Definition
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      ECR_REPO: ${{ inputs.ecr_repo_name }}
      CLUSTER_NAME: ${{ inputs.ecs_cluster_name }}
      TASK_FAMILY: ${{ inputs.task_family }}
      CONTAINER_NAME: ${{ inputs.container_name }}
      CONTAINER_PORT: ${{ inputs.container_port }}
      TASK_CPU: ${{ inputs.cpu }}
      TASK_MEMORY: ${{ inputs.memory }}
      EXECUTION_ROLE_NAME: ${{ inputs.execution_role_name }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "registry=$ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPO"

      - name: Ensure ECS cluster exists
        run: |
          aws ecs describe-clusters --clusters "$CLUSTER_NAME" --query 'clusters[?status==`ACTIVE`].clusterArn' --output text | grep -q "$CLUSTER_NAME" || \
          aws ecs create-cluster --cluster-name "$CLUSTER_NAME"

      - name: Ensure CloudWatch log group exists
        env:
          LOG_GROUP: /ecs/${{ env.TASK_FAMILY }}
        run: |
          aws logs describe-log-groups --log-group-name-prefix "$LOG_GROUP" --query 'logGroups[?logGroupName==`'"$LOG_GROUP"'`].logGroupName' --output text | grep -q "$LOG_GROUP" || \
          aws logs create-log-group --log-group-name "$LOG_GROUP"

      - name: Ensure IAM execution role exists and has policy
        env:
          ROLE_NAME: ${{ env.EXECUTION_ROLE_NAME }}
        run: |
          set -e
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            TRUST='{ "Version": "2012-10-17", "Statement": [{ "Effect": "Allow", "Principal": { "Service": "ecs-tasks.amazonaws.com" }, "Action": "sts:AssumeRole" }] }'
            aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "$TRUST" >/dev/null
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
          fi

      - name: Ensure IAM task role exists and has DynamoDB access
        env:
          ROLE_NAME: ecsPythonDynamoDBTaskRole
        run: |
          set -e
          if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            TRUST='{ "Version": "2012-10-17", "Statement": [{ "Effect": "Allow", "Principal": { "Service": "ecs-tasks.amazonaws.com" }, "Action": "sts:AssumeRole" }] }'
            aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "$TRUST" >/dev/null
          fi
          # Attach DynamoDB Full Access if not attached
          if ! aws iam list-attached-role-policies --role-name "$ROLE_NAME" --query 'AttachedPolicies[?PolicyArn==`arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess`]' --output text | grep -q 'AmazonDynamoDBFullAccess'; then
            aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
          fi

      - name: Register/Update ECS Task Definition
        env:
          REGISTRY: ${{ steps.aws.outputs.registry }}
          ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
          LOG_GROUP: /ecs/${{ env.TASK_FAMILY }}
        run: |
          set -e
          EXEC_ROLE_ARN=arn:aws:iam::$ACCOUNT_ID:role/$EXECUTION_ROLE_NAME
          TASK_ROLE_ARN=arn:aws:iam::$ACCOUNT_ID:role/ecsPythonDynamoDBTaskRole
          IMAGE_URI="$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          cat > taskdef.json <<EOF
          {
            "family": "${TASK_FAMILY}",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "${TASK_CPU}",
            "memory": "${TASK_MEMORY}",
            "executionRoleArn": "${EXEC_ROLE_ARN}",
            "taskRoleArn": "${TASK_ROLE_ARN}",
            "containerDefinitions": [
              {
                "name": "${CONTAINER_NAME}",
                "image": "${IMAGE_URI}",
                "portMappings": [
                  { "containerPort": ${CONTAINER_PORT}, "protocol": "tcp" }
                ],
                "essential": true,
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "${LOG_GROUP}",
                    "awslogs-region": "${AWS_REGION}",
                    "awslogs-stream-prefix": "ecs"
                  }
                }
              }
            ]
          }
          EOF
          echo "Registering task definition..."
          aws ecs register-task-definition --cli-input-json file://taskdef.json

      - name: Output resources
        run: |
          echo "ECR: ${{ steps.aws.outputs.registry }}/$ECR_REPO"
          echo "Cluster: $CLUSTER_NAME"
          echo "Task Family: $TASK_FAMILY"
