name: UI ECR Build and Push
on:
  workflow_dispatch:
    inputs:
      vite_api_base_url:
        description: "VITE_API_BASE_URL to embed at build time (e.g., https://api.example.com)"
        required: true
        default: "http://localhost:8000"

jobs:
  build-and-push:
    name: Build and Push UI Image
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"
      AWS_ECR_REPOSITORY_NAME: pastebin-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: List UI dir
        run: ls -la ./pastebin-ui

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v6
        with:
          context: ./pastebin-ui
          file: ./pastebin-ui/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ github.event.inputs.vite_api_base_url }}
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.AWS_ECR_REPOSITORY_NAME }}:${{ github.sha }}
